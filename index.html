<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web App Quản Lý - HAMACO TMS Firestore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans text-gray-800 h-screen flex flex-col md:flex-row overflow-hidden">

    <aside class="hidden md:flex flex-col w-64 bg-slate-800 text-white h-full justify-between p-4 shadow-xl">
        <div>
            <div class="text-xl font-bold p-2 text-center border-b border-slate-700 mb-6">
                <i class="fa-solid fa-cube text-teal-400 mr-2"></i>HAMACO TMS
            </div>
            <nav class="space-y-2">
                <button onclick="switchTab('HOME')" id="btn-HOME" class="tab-btn w-full flex items-center space-x-3 px-4 py-3 rounded-lg bg-teal-600 text-white font-medium transition">
                    <i class="fa-solid fa-house w-5"></i> <span>HOME</span>
                </button>
                <button onclick="switchTab('Báo cáo')" id="btn-Báo cáo" class="tab-btn w-full flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-slate-700 text-gray-300 transition">
                    <i class="fa-solid fa-chart-pie w-5"></i> <span>Báo cáo</span>
                </button>
                <button onclick="switchTab('Thêm')" id="btn-Thêm" class="tab-btn w-full flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-slate-700 text-gray-300 transition">
                    <i class="fa-solid fa-circle-plus w-5 text-emerald-400"></i> <span>Thêm mới</span>
                </button>
                <button onclick="switchTab('Vận chuyển')" id="btn-Vận chuyển" class="tab-btn w-full flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-slate-700 text-gray-300 transition">
                    <i class="fa-solid fa-truck w-5"></i> <span>Vận chuyển</span>
                </button>
                <button onclick="switchTab('Kho')" id="btn-Kho" class="tab-btn w-full flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-slate-700 text-gray-300 transition">
                    <i class="fa-solid fa-warehouse w-5"></i> <span>Kho</span>
                </button>
            </nav>
        </div>
        <div class="text-xs text-gray-400 text-center border-t border-slate-700 pt-3">
            © 2026 HAMACO Logistics
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden pb-16 md:pb-0">
        <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm">
            <h1 id="current-title" class="text-lg md:text-xl font-bold text-gray-800">HOME</h1>
            <div id="db-status" class="flex items-center space-x-2 text-sm text-green-600 bg-green-50 px-3 py-1 rounded-full font-medium">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                <span>Firestore Active</span>
            </div>
        </header>

        <div class="flex-1 p-4 md:p-6 overflow-y-auto">
            <div id="content-area" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 min-h-[300px]">
                <div class="flex justify-center items-center py-12">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-teal-600"></div>
                </div>
            </div>
        </div>
    </main>

    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 text-gray-400 flex justify-around items-center h-16 landscape:h-12 z-50 shadow-2xl">
        <button onclick="switchTab('HOME')" id="m-btn-HOME" class="mobile-tab-btn flex flex-col items-center justify-center w-full h-full text-teal-400">
            <i class="fa-solid fa-house text-lg landscape:text-base"></i>
            <span class="text-[10px] mt-0.5 landscape:hidden">HOME</span>
        </button>
        <button onclick="switchTab('Báo cáo')" id="m-btn-Báo cáo" class="mobile-tab-btn flex flex-col items-center justify-center w-full h-full">
            <i class="fa-solid fa-chart-pie text-lg landscape:text-base"></i>
            <span class="text-[10px] mt-0.5 landscape:hidden">Báo cáo</span>
        </button>
        <button onclick="switchTab('Thêm')" id="m-btn-Thêm" class="mobile-tab-btn relative -top-3 landscape:top-0 bg-teal-500 text-white rounded-full w-12 h-12 landscape:w-9 landscape:h-9 flex items-center justify-center shadow-lg transform active:scale-95 transition-transform border-4 border-slate-900 landscape:border-0">
            <i class="fa-solid fa-plus text-xl landscape:text-lg"></i>
        </button>
        <button onclick="switchTab('Vận chuyển')" id="m-btn-Vận chuyển" class="mobile-tab-btn flex flex-col items-center justify-center w-full h-full">
            <i class="fa-solid fa-truck text-lg landscape:text-base"></i>
            <span class="text-[10px] mt-0.5 landscape:hidden">Vận chuyển</span>
        </button>
        <button onclick="switchTab('Kho')" id="m-btn-Kho" class="mobile-tab-btn flex flex-col items-center justify-center w-full h-full">
            <i class="fa-solid fa-warehouse text-lg landscape:text-base"></i>
            <span class="text-[10px] mt-0.5 landscape:hidden">Kho</span>
        </button>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAUewVDshHW4Dxebo_hLahHUg12muBgsa4",
            authDomain: "hamaco-tms.firebaseapp.com",
            projectId: "hamaco-tms",
            storageBucket: "hamaco-tms.appspot.com",
            messagingSenderId: "355627029952",
            appId: "1:355627029952:web:72095fdd5dbfd2e1b12425",
            measurementId: "G-0ECZF7RFNH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let globalData = [];
        let currentTab = "HOME";

        // Lắng nghe dữ liệu real-time từ Collection "Sheet1" và Document "data_list" trên Firestore
        const docRef = doc(db, "Sheet1", "data_list");
        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                const firestoreData = docSnap.data();
                // Giải nén định dạng arrayValue của Firestore về dạng mảng JSON thuần túy để dựng bảng
                if (firestoreData.list && firestoreData.list.length > 0) {
                    globalData = firestoreData.list.map(item => {
                        let row = {};
                        for (let key in item.fields) {
                            row[key] = item.fields[key].stringValue || "";
                        }
                        return row;
                    });
                    renderUI();
                }
            } else {
                document.getElementById('content-area').innerHTML = `<p class="text-gray-500 text-center py-8">Chưa có dữ liệu đồng bộ trên Firestore.</p>`;
            }
        }, (error) => {
            console.error("Lỗi tải dữ liệu Firestore: ", error);
            document.getElementById('content-area').innerHTML = `<p class="text-red-500 text-center py-8">Lỗi phân quyền Rules hoặc sai cấu hình.</p>`;
        });

        window.renderUI = function() {
            document.getElementById('current-title').innerText = currentTab;
            
            if (currentTab === "Thêm") {
                document.getElementById('content-area').innerHTML = `<h3 class="text-lg font-semibold mb-4">Thêm mới thông tin</h3><p class="text-gray-600">Giao diện biểu mẫu nhập liệu...</p>`;
                return;
            }

            if (!globalData || globalData.length === 0) return;

            const headers = Object.keys(globalData[0]);
            
            let tableHTML = `
                <div class="overflow-x-auto rounded-lg border border-gray-200">
                    <table class="min-w-full divide-y divide-gray-200 text-sm text-left">
                        <thead class="bg-gray-50 text-gray-700 uppercase text-xs font-semibold">
                            <tr>
                                ${headers.map(h => `<th class="px-4 py-3 whitespace-nowrap">${h}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200 bg-white text-gray-600">
                            ${globalData.map(row => `
                                <tr class="hover:bg-gray-50 transition">
                                    ${headers.map(h => `<td class="px-4 py-3 whitespace-nowrap">${row[h] !== undefined ? row[h] : ''}</td>`).join('')}
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            document.getElementById('content-area').innerHTML = tableHTML;
        }

        window.switchTab = function(tabId) {
            currentTab = tabId;
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn w-full flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-slate-700 text-gray-300 transition";
            });
            const activeBtn = document.getElementById(`btn-${tabId}`);
            if(activeBtn) activeBtn.className = "tab-btn w-full flex items-center space-x-3 px-4 py-3 rounded-lg bg-teal-600 text-white font-medium transition";

            document.querySelectorAll('.mobile-tab-btn').forEach(btn => {
                btn.classList.remove('text-teal-400');
            });
            const activeMobBtn = document.getElementById(`m-btn-${tabId}`);
            if(activeMobBtn && tabId !== "Thêm") activeMobBtn.classList.add('text-teal-400');

            renderUI();
        }
    </script>
</body>
</html>
