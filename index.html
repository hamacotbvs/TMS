<script type="module">
        // CẤU HÌNH FIREBASE
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig = { 
            apiKey: "AIzaSyA7SQQRocTLFzJ3_yz4utnEljaj4Gp6tP8",
            authDomain: "hamaco-tms-c4b70.firebaseapp.com",
            projectId: "hamaco-tms-c4b70",
            storageBucket: "hamaco-tms-c4b70.firebasestorage.app",
            messagingSenderId: "685425304488",
            appId: "1:685425304488:web:6a999a4a6bf1147a21b39d",
            measurementId: "G-L7RQZWHQ4J"
        };

        // KHỞI TẠO FIREBASE
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        console.log("Firebase & Firestore đã được kết nối thành công!");

        // BIẾN TOÀN CỤC CỦA BIỂU ĐỒ VÀ FIRESTORE
        let bieuDoBaoCao = null;
        let unsubscribeFirebase = null; 

        // NÚT RESET APP
        const idNutLamMoi = document.getElementById('NUT-LAM-MOI-APP');
        if (idNutLamMoi) {
            idNutLamMoi.addEventListener('click', () => {
                const iconSvg = idNutLamMoi.querySelector('svg'); 
                if (iconSvg) {
                    iconSvg.style.transform = 'rotate(360deg)'; 
                    iconSvg.style.transition = 'transform 0.4s ease';
                } 
                setTimeout(() => { window.location.reload(); }, 350); 
            });
        }

        // XỬ LÝ CHUYỂN TAB TRÊN GIAO DIỆN
        window.switchTab = function(tabId) { 
            const trangs = document.querySelectorAll('.trang-content'); 
            trangs.forEach(page => page.classList.remove('active')); 
            
            const menuItems = document.querySelectorAll('.MENU-item'); 
            menuItems.forEach(item => item.classList.remove('active')); 
            
            document.getElementById(tabId).classList.add('active'); 
            if (window.event && window.event.currentTarget) {
                window.event.currentTarget.classList.add('active');
            } else {
                const iconMap = {
                    'home': '.fa-house',
                    'bao-cao': '.fa-chart-pie',
                    'them-moi': '.fa-plus',
                    'kho': '.fa-boxes-stacked',
                    'van-chuyen': '.fa-car-side'
                };
                const iconClass = iconMap[tabId];
                if (iconClass) {
                    const iconEl = document.querySelector(`.MENU-DUOI ${iconClass}`);
                    if (iconEl) iconEl.parentElement.classList.add('active');
                }
            }

            if (tabId === 'bao-cao') {
                if (!bieuDoBaoCao) {
                    khoiTaoKhungBieuDo();
                }
                const elNam = document.getElementById('chon-nam');
                if (elNam) {
                    taiDuLieuBieuDoTheoNam(elNam.value);
                }
            }
        }

        // KHI THAY ĐỔI Ô CHỌN NĂM -> TỰ ĐỘNG TẢI LẠI BIỂU ĐỒ THEO NĂM ĐÓ
        function xuLyBoLocThoiGian() {
            const elNam = document.getElementById('chon-nam');
            if (elNam) {
                taiDuLieuBieuDoTheoNam(elNam.value);
            }
        }

        // CẤU HÌNH KHỞI TẠO KHUNG BIỂU ĐỒ TRỐNG (CHART.JS)
        function khoiTaoKhungBieuDo() {
            const ctx = document.getElementById('bieuDoSanLuong');
            if (!ctx) return;

            if (bieuDoBaoCao) {
                bieuDoBaoCao.destroy(); 
            }

            bieuDoBaoCao = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['T1', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'T8', 'T9', 'T10', 'T11', 'T12'],
                    datasets: [
                        {
                            label: '🚚 Giao hàng',
                            data: Array(12).fill(0), 
                            backgroundColor: '#007acc',
                            borderRadius: 4
                        },
                        {
                            label: '📦 Gửi chành',
                            data: Array(12).fill(0), 
                            backgroundColor: '#ff9f43',
                            borderRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: { font: { family: 'Roboto', size: 12 } }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return ` ${context.dataset.label}: ${context.raw.toLocaleString('vi-VN')} tấn`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { stacked: true, grid: { display: false } },
                        y: {
                            stacked: true,
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Sản lượng (Tấn)',
                                font: { family: 'Roboto', weight: 'bold' }
                            }
                        }
                    }
                }
            });
        }

        // HÀM ĐỌC VÀ CẬP NHẬT DỮ LIỆU TỪ FIRESTORE (ĐÃ FIX LỖI SAI KIỂU DỮ LIỆU ĐUÔI)
        function taiDuLieuBieuDoTheoNam(namLoc) {
            if (unsubscribeFirebase) {
                unsubscribeFirebase();
            }

            console.log(`Bắt đầu kết nối và quét bảng TUYENDUONG cho năm: ${namLoc}`);
            const collectionRef = collection(db, "TUYENDUONG"); 

            // Loại bỏ hoàn toàn 'query' và 'where' của Firebase để tự lọc dữ liệu bằng JS
            // Giải pháp này giải quyết triệt để việc db lưu chuỗi "2026" hay số 2026.
            unsubscribeFirebase = onSnapshot(collectionRef, (querySnapshot) => {
                const sanLuongGiaoHang = Array(12).fill(0);
                const sanLuongGuiChanh = Array(12).fill(0);
                let soDongQuetDuoc = 0;

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    // Kiểm tra và ép toàn bộ về kiểu Chuỗi (.toString()) để so sánh chính xác tuyệt đối
                    if (data.nam && data.nam.toString().trim() === namLoc.toString().trim()) {
                        soDongQuetDuoc++;
                        
                        const thang = parseInt(data.thang) - 1; 
                        const taiTrong = parseFloat(data.tTai) || 0;
                        const htGiaoNhan = data.htGiaoNhan ? data.htGiaoNhan.toString().trim() : "";

                        if (thang >= 0 && thang <= 11) {
                            if (htGiaoNhan === "Giao hàng") {
                                sanLuongGiaoHang[thang] += taiTrong;
                            } else if (htGiaoNhan === "Gửi chành") {
                                sanLuongGuiChanh[thang] += taiTrong;
                            }
                        }
                    }
                });

                console.log(`[Kết quả]: Tìm thấy tổng cộng ${soDongQuetDuoc} chuyến hàng hợp lệ của năm ${namLoc}`);

                if (bieuDoBaoCao) {
                    bieuDoBaoCao.data.datasets[0].data = sanLuongGiaoHang;
                    bieuDoBaoCao.data.datasets[1].data = sanLuongGuiChanh;
                    bieuDoBaoCao.update();
                }
            }, (error) => {
                console.error("Lỗi đồng bộ dữ liệu Firestore: ", error);
            });
        }

        // SETUP KHỞI CHẠY AN TOÀN KHI TẢI TRANG
        const elThang = document.getElementById('chon-thang');
        const elNam = document.getElementById('chon-nam');

        if (elThang && elNam) {
            elThang.value = new Date().getMonth() + 1;
            elNam.addEventListener('change', xuLyBoLocThoiGian);
        }

        // Tự động dựng sẵn khung biểu đồ và nạp dữ liệu năm hiện tại ngay khi mở app
        document.addEventListener('DOMContentLoaded', () => {
            khoiTaoKhungBieuDo();
            if (elNam) {
                taiDuLieuBieuDoTheoNam(elNam.value);
            }
        });
    </script>
