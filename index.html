<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <style>
        * {box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif;} 
        body {background-color: #f7f9fc; color: #333; display: flex; flex-direction: column; height: 100vh; overflow: hidden;-webkit-text-size-adjust: 100%;} 
        .KHUNG-CAC-TAB {flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 100px;} 
        .trang-content {display: none;} 
        .trang-content.active {display: block;} 
        
        .KHUNG-CON-TRONG-TAB {background: #fff; padding: 24px; border-radius: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.02); margin-bottom: 16px; border: 1px solid #f0f2f5;}
        .tieu-de-bieu-do {font-size: 18px; font-weight: 700; color: #1e293b; text-align: center; margin-bottom: 15px;}
        .vung-bieu-do { position: relative; width: 100%; height: 340px; }
        
        .MENU-DUOI {position: fixed; bottom: 20px; left: 5%; right: 5%; height: 70px; background-color: #007acc; border-radius: 35px; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 8px 24px rgba(0, 122, 204, 0.3); z-index: 1000; padding: 0 10px;} 
        .MENU-item {display: flex; flex-direction: column; align-items: center; justify-content: center; color: rgba(255, 255, 255, 0.7); text-decoration: none; font-size: 11px; font-weight: 500; cursor: pointer; flex: 1; height: 100%;} 
        .MENU-item i {font-size: 20px; margin-bottom: 4px;}
        .MENU-item.active {color: #ffffff; font-weight: 700;} 
        .MENU-item.add-btn {flex: none; width: 54px; height: 54px; background-color: #ffffff; color: #007acc; border-radius: 50%; font-size: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); margin-bottom: 10px; display: flex; align-items: center; justify-content: center;} 
        .MENU-item.add-btn i {margin-bottom: 0; font-size: 24px;}

        .loading-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #666; font-size: 14px; display: flex; align-items: center; gap: 8px; z-index: 10; width: 90%; text-align: center; justify-content: center;}
        .loading-box i { animation: spin 1s linear infinite; color: #3498db; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

<body>
    <div class="KHUNG-CAC-TAB">
        <div id="home" class="trang-content active">
            <div class="KHUNG-CON-TRONG-TAB" style="position: relative; min-height: 250px;">
                <h2 class="tieu-de-bieu-do">Biểu đồ Tải trọng & Sản lượng năm 2026</h2>
                <div id="loading" class="loading-box"><i class="fa-solid fa-spinner"></i> Đang tải dữ liệu từ server...</div>
                <div class="vung-bieu-do">
                    <canvas id="bieuDoTaiTrongThang"></canvas>
                </div>
            </div>
        </div>

        <div id="bao-cao" class="trang-content">
            <div class="KHUNG-CON-TRONG-TAB"><h2>📊 Báo cáo & Thống kê</h2></div>
        </div>
        <div id="them-moi" class="trang-content">
            <div class="KHUNG-CON-TRONG-TAB"><h2>➕ Thêm mới</h2></div>
        </div>
        <div id="kho" class="trang-content">
            <div class="KHUNG-CON-TRONG-TAB"><h2>📦 Quản lý Kho</h2></div>
        </div>
        <div id="van-chuyen" class="trang-content">
            <div class="KHUNG-CON-TRONG-TAB"><h2>🚚 Vận chuyển</h2></div>
        </div>
    </div>

    <nav class="MENU-DUOI">
        <div class="MENU-item active" onclick="switchTab(event, 'home')"><i class="fa-solid fa-house"></i><span>HOME</span></div>
        <div class="MENU-item" onclick="switchTab(event, 'bao-cao')"><i class="fa-solid fa-chart-pie"></i><span>Báo cáo</span></div>
        <div class="MENU-item add-btn" onclick="switchTab(event, 'them-moi')"><i class="fa-solid fa-plus"></i></div>
        <div class="MENU-item" onclick="switchTab(event, 'kho')"><i class="fa-solid fa-boxes-stacked"></i><span>Kho</span></div>
        <div class="MENU-item" onclick="switchTab(event, 'van-chuyen')"><i class="fa-solid fa-car-side"></i><span>Vận chuyển</span></div>
    </nav>
