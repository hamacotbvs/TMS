<script type="module">
        // --- 1. CẤU HÌNH FIREBASE ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAG1TAeGdizpRS6yLjRf_CFGdk7MeXxifU",
            authDomain: "app-tms-bf7ec.firebaseapp.com",
            projectId: "app-tms-bf7ec",
            storageBucket: "app-tms-bf7ec.firebasestorage.app",
            messagingSenderId: "30608691122",
            appId: "1:30608691122:web:55220ddcd6779e71b09eab",
            measurementId: "G-3E90723GR6"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        console.log("Firebase & Firestore đã được kết nối thành công!");

        // --- 2. NÚT RESET ---
        const idNutLamMoi = document.getElementById('NUT-LAM-MOI-APP');
        if (idNutLamMoi) {
            idNutLamMoi.addEventListener('click', () => {
                const iconSvg = idNutLamMoi.querySelector('svg'); 
                if (iconSvg) { iconSvg.style.transform = 'rotate(360deg)'; iconSvg.style.transition = 'transform 0.4s ease'; } 
                setTimeout(() => { window.location.reload(); }, 350); 
            });
        }

        // --- 3. XỬ LÝ CHUYỂN TAB ---
        window.switchTab = function(tabId, event) {
            const trangs = document.querySelectorAll('.trang-content'); trangs.forEach(page => page.classList.remove('active'));
            const menuItems = document.querySelectorAll('.MENU-item'); menuItems.forEach(item => item.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if (event && event.currentTarget) { event.currentTarget.classList.add('active'); } 
        }

        // --- 4. BÁO CÁO NHÓM THEO PHƯƠNG TIỆN + CHUYẾN ---
        const oChonNgay = document.getElementById('input-ngay-xem');
        const bodyBangBaoCao = document.getElementById('du-lieu-bao-cao-xe');
        let unsubscribeReport = null;

        // Tự động gán ngày hiện tại làm mặc định
        const homNay = new Date();
        const dinhDangHomNay = homNay.toISOString().split('T')[0];
        oChonNgay.value = dinhDangHomNay;

        // Cập nhật lại tiêu đề bảng ở HTML cho khớp với các cột mới
        const theadBang = document.querySelector('.bang-bao-cao thead');
        if (theadBang) {
            theadBang.innerHTML = `
                <tr>
                    <th>Phương tiện</th>
                    <th>Chuyến</th>
                    <th>Bột trét (kg)</th>
                    <th>Sơn/TBVS (kg)</th>
                    <th>Tổng tải (kg)</th>
                    <th>Thành tiền (đ)</th>
                    <th>Trạng thái</th>
                </tr>
            `;
        }

        function taiBaoCaoTheoNgay(chuoiNgayYMD) {
            if(!chuoiNgayYMD) return;

            const phanTach = chuoiNgayYMD.split('-'); 
            const ngayTimKiem = chuoiNgayYMD; // Định dạng YYYY-MM-DD khớp database
            const ngayHienThi = `${phanTach[2]}/${phanTach[1]}/${phanTach[0]}`;

            const thangChon = parseInt(phanTach[1], 10); 
            const tenCollectionThang = `TUYENDUONGT${thangChon}`; 

            bodyBangBaoCao.innerHTML = `<tr><td colspan="7" class="txt-rong"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu...</td></tr>`;

            if (unsubscribeReport) unsubscribeReport();

            try {
                // Lọc dữ liệu theo ngày bắt đầu giao hàng
                const q = query(
                    collection(db, tenCollectionThang), 
                    where("Bắt_đầu_giao_hàng", ">=", ngayTimKiem),
                    where("Bắt_đầu_giao_hàng", "<=", ngayTimKiem + "\uf8ff")
                );

                unsubscribeReport = onSnapshot(q, (querySnapshot) => {
                    bodyBangBaoCao.innerHTML = "";

                    if(querySnapshot.empty) {
                        bodyBangBaoCao.innerHTML = `<tr><td colspan="7" class="txt-rong">Chưa có xe nào được duyệt đi giao trong ngày ${ngayHienThi}</td></tr>`;
                        return;
                    }

                    // Đối tượng trung gian để lưu trữ dữ liệu gom nhóm
                    const groups = {};

                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        
                        const phuongTien = data["Phương_tiện"] || 'Chưa xác định';
                        const chuyen = data["Chuyến"] || '1';
                        
                        // Tạo Key duy nhất để gom nhóm: kết hợp giữa Tên xe và Số chuyến
                        const groupKey = `${phuongTien}_Chuyen_${chuyen}`;

                        // Ép kiểu dữ liệu dạng số, nếu trống hoặc lỗi thì mặc định là 0
                        const botTret = parseFloat(data["Bột_trét(kg)"] || data["Bột_trét"] || 0);
                        const sonTBVS = parseFloat(data["Sơn/TBVS"] || data["Sơn_TBVS"] || 0);
                        const tongTai = parseFloat(data["TTải"] || data["Tổng tải(kg)"] || 0);
                        const thanhTien = parseFloat(data["Thành_tiền"] || data["Thành tiền"] || 0);
                        const trangThai = data["Duyệt"] || data["Status"] || 'Mới';

                        if (!groups[groupKey]) {
                            // Nếu nhóm chưa tồn tại, khởi tạo nhóm mới
                            groups[groupKey] = {
                                phuongTien: phuongTien,
                                chuyen: chuyen,
                                botTret: botTret,
                                sonTBVS: sonTBVS,
                                tongTai: tongTai,
                                thanhTien: thanhTien,
                                trangThai: trangThai
                            };
                        } else {
                            // Nếu nhóm đã tồn tại, cộng dồn luỹ kế các cột số lượng
                            groups[groupKey].botTret += botTret;
                            groups[groupKey].sonTBVS += sonTBVS;
                            groups[groupKey].tongTai += tongTai;
                            groups[groupKey].thanhTien += thanhTien;
                            // Giữ lại trạng thái của bản ghi cuối cùng (hoặc ưu tiên trạng thái "Đã giao hàng")
                            if (trangThai === "Đã giao hàng") {
                                groups[groupKey].trangThai = trangThai;
                            }
                        }
                    });

                    // Duyệt qua đối tượng nhóm và đổ dữ liệu đã tính tổng lên bảng giao diện
                    Object.values(groups).forEach((group) => {
                        let classBadge = "status-khac";
                        if(group.trangThai === "Đã giao hàng") classBadge = "status-dagiao";
                        else if(group.trangThai === "Đang giao hàng") classBadge = "status-chuanbi";

                        const hangBaoCao = document.createElement('tr');
                        hangBaoCao.innerHTML = `
                            <td><strong>${group.phuongTien}</strong></td>
                            <td>Chuyến ${group.chuyen}</td>
                            <td>${group.botTret.toLocaleString()}</td>
                            <td>${group.sonTBVS.toLocaleString()}</td>
                            <td>${group.tongTai.toLocaleString()}</td>
                            <td><strong>${group.thanhTien.toLocaleString()}</strong></td>
                            <td><span class="badge-status ${classBadge}">${group.trangThai}</span></td>
                        `;
                        bodyBangBaoCao.appendChild(hangBaoCao);
                    });
                }, (error) => {
                    console.error("Lỗi: ", error);
                    bodyBangBaoCao.innerHTML = `<tr><td colspan="7" class="txt-rong" style="color:red;">Không đọc được dữ liệu bảng ${tenCollectionThang}.</td></tr>`;
                });
            } catch (err) {
                bodyBangBaoCao.innerHTML = `<tr><td colspan="7" class="txt-rong" style="color:red;">Lỗi hệ thống lập truy vấn.</td></tr>`;
            }
        }

        // Khởi chạy lần đầu và lắng nghe sự kiện
        taiBaoCaoTheoNgay(oChonNgay.value);
        oChonNgay.addEventListener('change', (e) => { taiBaoCaoTheoNgay(e.target.value); });
    </script>
