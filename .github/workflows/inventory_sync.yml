name: HAMACO Inventory Manual Sync

on:
  workflow_dispatch: # Chỉ cho phép nhấn nút kích hoạt chạy thủ công trên GitHub Actions

jobs:
  sync-inventory:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout mã nguồn từ GitHub
      uses: actions/checkout@v4

    - name: Cài đặt môi trường Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Cài đặt thư viện xử lý Excel và Firebase
      run: npm install

    - name: Thực thi so sánh RAM và đồng bộ Firestore
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: node index.js
